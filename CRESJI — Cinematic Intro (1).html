--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif;--g:.25;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--silver)}
body{height:360vh;overflow-x:hidden}
.stage{position:fixed;inset:0;overflow:hidden;background:
 radial-gradient(ellipse 70% 55% at 50% 30%,rgba(255,255,255,.07),transparent 70%),
 repeating-linear-gradient(92deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px,rgba(0,0,0,.05) 9px 11px),var(--bg);
 transition:opacity .9s ease,filter .9s ease}
.stage.leave{opacity:0;filter:blur(8px)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55))}
.stage::after{content:"";position:absolute;inset:-50%;pointer-events:none;z-index:10;opacity:.09;mix-blend-mode:overlay;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
 animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

.logo-wrap{position:absolute;top:calc(4vh + env(safe-area-inset-top,0px));left:50%;width:min(56vw,64vh,560px);aspect-ratio:875 / 328;translate:-50% 0;will-change:transform;z-index:5}
.logo{position:absolute;inset:0;animation:float 6.5s ease-in-out 4.4s infinite;will-change:transform}
.lsw{position:absolute;left:14%;right:14%;bottom:-9%;height:9%;animation:fade 1.6s ease 3.4s both;pointer-events:none}
.lshadow{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.62),transparent 70%);filter:blur(7px);animation:shd 6.5s ease-in-out 4.4s infinite}
.pcs{position:absolute;inset:0}.pcs img{position:absolute;display:block;animation:pin 1.2s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.pcs img.leaf{transform-origin:3% 90%;animation:grow 1.8s cubic-bezier(.2,.7,.2,1) 2.7s both,sway 5.5s ease-in-out 4.6s infinite,glint 4s ease-in-out 4.6s infinite}
.logo b{position:absolute;inset:0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
 background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 140% 0/260% 100% no-repeat;mix-blend-mode:screen;animation:sweep 12s ease-in-out 5.5s infinite}
@keyframes pin{from{opacity:0;transform:translateY(22px) scale(.95);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes grow{from{opacity:0;transform:scale(.15) rotate(-18deg)}to{opacity:1;transform:none}}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-2.6deg) scaleY(1.03)}65%{transform:rotate(2.2deg) scaleY(.98)}}
@keyframes glint{50%{filter:brightness(1.25) saturate(1.15)}}
@keyframes reveal{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.3deg) scale(1)}40%,50%{transform:translateY(-7px) rotate(.3deg) scale(1.008)}}
@keyframes shd{0%,100%{opacity:.95;transform:scale(1)}40%,50%{opacity:.45;transform:scaleX(.86)}}
@keyframes sweep{0%,60%{background-position:140% 0}100%{background-position:-40% 0}}

.marquee{position:absolute;left:0;right:0;top:26vh;height:34vh;display:flex;flex-direction:column;justify-content:center;gap:1.2vh;
 -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);z-index:3;animation:fade 2s ease 3.2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.row{white-space:nowrap;overflow:hidden;font-family:'Playfair Display',Georgia,serif;font-weight:900;line-height:1.1;letter-spacing:.03em;padding:.12em 0}
.row.a{font-size:min(9vw,14vh)}.row.b{font-size:min(5vw,7.6vh);font-weight:800}
.track{display:flex;width:max-content;will-change:transform;align-items:center;position:relative}
.unit{display:flex;align-items:center}
.w{display:block;margin:0 .3em;transform-origin:50% 55%;will-change:transform,opacity,filter}
.t{display:block;padding:0 .04em;background-size:cover;background-position:center;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sp{width:1px;height:.32em;background:rgba(217,221,224,.2);margin:0 .5em}
.amb{position:absolute;left:8vw;top:18vh;width:84vw;height:60vh;background:radial-gradient(ellipse,rgba(255,232,196,.055),transparent 70%);animation:drift 28s ease-in-out infinite alternate;pointer-events:none;z-index:1}
@keyframes drift{from{transform:translateX(-7vw)}to{transform:translateX(7vw)}}

.welcome-wrap{position:absolute;left:50%;top:76vh;translate:-50% -50%;text-align:center;z-index:6;will-change:transform;animation:fade 2s ease 3.8s both}
.welcome{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6.2vw,88px);letter-spacing:.22em;padding-left:.22em;line-height:1;
 background:linear-gradient(180deg,#fff,#a9b0b6 70%,#e6e9ec);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 calc(10px + var(--g)*40px) rgba(255,255,255,calc(.1 + var(--g)*.25)));animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.82;transform:scale(1.025)}}
.sub{margin-top:.9em;font-family:var(--sans);font-weight:300;font-size:clamp(9px,1vw,12px);letter-spacing:.55em;padding-left:.55em;color:rgba(217,221,224,.55)}
.sub em{font-style:normal;color:var(--green)}

.lang{position:absolute;left:0;top:0;z-index:4;font-family:var(--serif);font-size:clamp(18px,2.5vw,34px);font-weight:500;letter-spacing:.06em;white-space:nowrap;color:var(--silver);will-change:transform,opacity,filter;opacity:0}

.enter{position:absolute;left:50%;bottom:calc(3.5vh + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:8;background:transparent;border:1px solid rgba(42,168,118,.7);color:var(--silver);
 font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.38em;padding:14px 30px 14px calc(30px + .38em);cursor:pointer;display:flex;gap:14px;align-items:center;
 transition:letter-spacing .5s ease,box-shadow .5s ease,border-color .5s ease,color .5s;animation:fade 2s ease 4.6s both}
.enter::before{content:"";position:absolute;inset:0;border:1px solid var(--green);opacity:0;transition:inset .5s ease,opacity .5s ease;pointer-events:none}
.enter span{display:inline-block;transition:transform .5s ease;animation:nudge 3.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.enter:hover,.enter:focus-visible{letter-spacing:.5em;border-color:var(--green);color:#fff;box-shadow:0 0 28px rgba(42,168,118,.28),inset 0 0 18px rgba(42,168,118,.12);outline:none}
.enter:hover::before,.enter:focus-visible::before{inset:-7px;opacity:.45}
.enter:hover span,.enter:focus-visible span{animation:none;transform:translateX(5px)}
@media (prefers-reduced-motion:reduce){.stage::after,.logo,.logo b,.lshadow,.amb,.enter span{animation:none}}
@media (max-width:700px){.logo-wrap{width:84vw}.marquee{top:24vh;height:38vh;gap:2vh}.row.a{font-size:min(17vw,13vh)}.row.b{font-size:min(10vw,7.5vh)}.welcome-wrap{top:77vh}}
</style>
</head>

  cx.putImageData(im,0,0);return cv.toDataURL('image/jpeg',.8);
}
(function(){let css='';for(const n in MAT){const m=MAT[n],e=m.e;
  css+=`.t[data-m="${n}"]{background-image:url(${tex(m)});filter:drop-shadow(0 -1px 0 rgba(255,255,255,.2)) drop-shadow(1px 1px 0 ${e}) drop-shadow(1px 1px 0 ${e}) drop-shadow(1px 1px 0 ${e}) drop-shadow(0 10px 12px rgba(0,0,0,.55))}`}
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st)})();

/* marquee rows */
const rows=[...document.querySelectorAll('.row')].map((el,i)=>({el,track:el.firstElementChild,x:0,uw:1,els:[],
  words:[['PLYWOOD','VENEER','LAMINATES','WOOD','INTERIORS'],['DESIGN','QUALITY','CRAFT','SURFACES','ARCHITECTURE']][i],speed:[62,38][i],k:[1,.62][i]}));
function buildRows(){
  rows.forEach((r,i)=>{
    const unit='<div class="unit">'+r.words.map(w=>`<span class="w"><span class="t" data-m="${w}">${w}</span></span><i class="sp"></i>`).join('')+'</div>';
    r.track.innerHTML=unit;r.uw=r.track.firstElementChild.offsetWidth||1;
    r.track.innerHTML=unit.repeat(Math.ceil(W/r.uw)+2);
    r.els=[...r.track.querySelectorAll('.w')].map(el=>({el,off:el.offsetLeft,w:el.offsetWidth,f:-1}));
    if(!r.init){r.x=-r.uw*(i*.37);r.init=1}
  });
}
function moveRows(mul,dt){
  rows.forEach(r=>{
    r.x-=r.speed*mul*RMS*dt;if(r.x<=-r.uw)r.x+=r.uw;
    r.track.style.transform=`translate3d(${r.x.toFixed(2)}px,0,0)`;
    r.els.forEach(o=>{
      const c=r.x+o.off+o.w/2;if(c<-o.w||c>W+o.w)return;
      const e=1-Math.min(1,Math.abs(c-W/2)/(W*.55)),q=e*e*(3-2*e);
      o.el.style.transform=`scale(${(.7+.3*q).toFixed(3)})`;
      o.el.style.opacity=((.45+.55*q)*r.k).toFixed(3);
      const lx=W/2+Math.sin(performance.now()/1000*(RM?.02:.11)+r.k*2)*W*.32,z=(c-lx)/(W*.17),bo=Math.round(Math.exp(-z*z)*10)/10;
      const bl=RM?0:Math.round((1-q)*7)/2,br=.55+.45*q+.4*bo,key=bl*1000+Math.round(br*20)*10+bo*10;
      if(o.f!==key){o.f=key;o.el.style.filter=`blur(${bl}px) brightness(${br.toFixed(2)}) contrast(${(1+.3*bo).toFixed(2)})`}
    });
  });
}

/* language lanes */
const names=['తెలుగు','हिंदी','ಕನ್ನಡ','தமிழ்','English','मराठी','മലയാളം','বাংলা','ગુજરાતી','ਪੰਜਾਬੀ'];
const laneDef=[{dir:1,k:-1,o:22,sp:46,mx:.42},{dir:-1,k:-1,o:62,sp:34,mx:.65},{dir:-1,k:1,o:22,sp:42,mx:.42},{dir:1,k:1,o:58,sp:30,mx:.65}];
const lanes=laneDef.map(d=>({...d,pos:Math.random()*400,items:[],y:0}));
const host=document.getElementById('langs');
names.forEach((n,i)=>{const el=document.createElement('div');el.className='lang';el.textContent=n;host.appendChild(el);el.z=[1,.85,1.15,.9,1.1,.8,1,.9,1.05,.85][i];lanes[i%4].items.push(el)});
let L=W+400;
function layout(){
  W=innerWidth;H=innerHeight;L=W+500;
  const r=wel.getBoundingClientRect(),s=r.height/ (wel.offsetHeight||1);
  const top=wel.offsetTop-wel.offsetHeight/2,bot=wel.offsetTop+wel.offsetHeight/2; // unscaled geometry
  lanes.forEach(l=>{l.y=l.k<0?top-l.o:bot+l.o});
  buildRows();
}
addEventListener('resize',layout);
document.fonts&&document.fonts.ready.then(layout);
layout();

/* loop */
let last=performance.now(),lastY=scrollY,vel=0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const max=Math.max(1,document.body.scrollHeight-H),y=scrollY,p=clamp(y/max,0,1);
  vel+=(Math.min(Math.abs(y-lastY)/Math.max(dt,.001),3000)-vel)*Math.min(1,dt*4);lastY=y;
  const mul=1+vel/700+p*1.4;
  moveRows(mul,dt);
  lanes.forEach(l=>{
    l.pos=(l.pos+l.sp*RMS*(1+vel/500+p*.9)*dt);
    const n=l.items.length;
    l.items.forEach((el,i)=>{
      const s=((l.pos+i*L/n)%L+L)%L;
      const x=l.dir>0?s-250:W+250-s;
      const e=clamp(1-Math.abs(x-W/2)/(W*.62),0,1);
      const q=e*e*(3-2*e);
      el.style.opacity=(l.mx*q*(.55+.45*el.z)).toFixed(3);
      el.style.filter=RM?"none":`blur(${Math.max(0,(1-q)*5+(1-el.z)*3).toFixed(1)}px)`;
      el.style.transform=`translate3d(${x}px,${l.y}px,0) translate(-50%,-50%) scale(${((.78+.3*q)*el.z).toFixed(3)})`;
    });
  });
  logo.style.transform=`translateY(${-p*60}px) scale(${1-p*.08})`;
  wel.style.transform=`scale(${1+p*.16})`;
  stage.style.setProperty('--g',(.25+p*.75).toFixed(3));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement!==document.getElementById('enter'))document.getElementById('enter').click()});
/* enter */
document.getElementById('enter').addEventListener('click',()=>{
  stage.classList.add('leave');
  setTimeout(()=>{if(HOME_URL)location.href=HOME_URL},900);
});
</script>
